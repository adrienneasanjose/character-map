<script>
var video = document.querySelector("#videoElement");

if (navigator.mediaDevices.getUserMedia) {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(function (stream) {
      video.srcObject = stream;

}

const textElement = document.getElementById("typing-text");
        const message = "character customization may vary depending on who you are, what the game is, and how you might want to be perceived. this website explores different characters and why they were made that way.";
        let index = 0;

        function typeWriter() {
            if (index < message.length) {
                textElement.textContent += message.charAt(index); // Add next character
                index++;
                setTimeout(typeWriter, 100); // Controls the speed (in milliseconds)
            }
        }

        // Start the effect when the page loads
        window.onload = typeWriter;



</script>
